name: Rule proposal
description: Propose a new rule or a change to one of the 12
labels: [rule]
body:
  - type: textarea
    id: before
    attributes:
      label: Before
      description: A real response you got from an agent. Paste it exactly. Remove names, numbers and account details.
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: After
      description: What it should have said instead.
    validations:
      required: true
  - type: input
    id: who
    attributes:
      label: Who does this help, in one sentence?
    validations:
      required: true
  - type: dropdown
    id: which
    attributes:
      label: Which rule does this change?
      options: ["1 Verdict first", "2 One of four verdicts", "3 Pattern in plain words", "4 What to do in one line", "5 Never shame", "6 Never 'you should have known'", "7 Checking with someone is normal", "8 Never help hide it", "9 Friend + money + secrecy", "10 No legal advice", "11 Money already sent: next step", "12 Same format every time", "New rule (say which one it replaces)"]
    validations:
      required: true
